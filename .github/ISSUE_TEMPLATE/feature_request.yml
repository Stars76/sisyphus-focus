name: ✨ 功能建议
description: 提出一个想解决的问题或新功能设想
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 先说清楚痛点或场景，而不是直接说想要什么功能
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 设想的方案
      description: 你希望应用怎么做，包括交互上大致长什么样
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过或尝试过的其它办法（可选）
    validations:
      required: false

  - type: dropdown
    id: pr-willingness
    attributes:
      label: 是否愿意自己提 PR
      options:
        - 愿意
        - 可以试试
        - 只是提个想法
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: 其它
      description: 补充说明（可选）
    validations:
      required: false
