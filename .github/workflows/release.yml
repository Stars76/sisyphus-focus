name: Release

# 打 tag（v2.0.0 这类）即自动构建 portable + NSIS 并创建 GitHub Release，
# 附带两个 exe 与 SHA256SUMS.txt。也可在 Actions 页面手动 workflow_dispatch 触发。
# 配置了 CSC_LINK / CSC_KEY_PASSWORD（或走 Azure Trusted Signing）时产物自动签名，
# 并且签名校验会变成硬门槛；未配置时按未签名产物照常发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 tag（手动触发时用于发布，例如 v2.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-cache-${{ runner.os }}-

      - name: Install dependencies
        # CI 走官方源（仓库根 .npmrc 给本机配的是国内镜像；官方 runner 上官方源更稳）
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      # 与本地一致的构建口径：门禁（check/selftest/run-all）→ portable+NSIS →
      # current-build asar 与源码逐字节对拍 → 打印产物 SHA-256 与签名状态。失败即停。
      - name: Build (gates + parity + portable/nsis)
        shell: pwsh
        run: ./build/win-build.ps1

      - name: Verify signature status
        shell: pwsh
        run: |
          if ($env:CSC_LINK) { ./build/check-signature.ps1 -RequireSigned } else { ./build/check-signature.ps1 }

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          Remove-Item release/SHA256SUMS.txt -ErrorAction SilentlyContinue
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$h  $($_.Name)" | Out-File -Append release/SHA256SUMS.txt -Encoding ascii
          }
          Get-Content release/SHA256SUMS.txt

      - name: Compose release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $lines = @()
          $lines += "## 下载 / Download"
          $lines += ""
          $lines += "| 文件 | 说明 |"
          $lines += "|---|---|"
          $lines += "| ``Sisyphus-$version-setup.exe`` | 安装版（NSIS）：装到 ``%LOCALAPPDATA%\Programs``，创建桌面与开始菜单快捷方式 |"
          $lines += "| ``Sisyphus-$version-portable.exe`` | 免安装版：双击直接运行 |"
          $lines += "| ``SHA256SUMS.txt`` | 产物校验值：``Get-FileHash -Algorithm SHA256 .\Sisyphus-$version-portable.exe`` |"
          $lines += ""
          if ($env:CSC_LINK) {
            $sig = Get-AuthenticodeSignature -LiteralPath (Get-ChildItem release -Filter *.exe | Select-Object -First 1).FullName
            $lines += "产物已代码签名（签名主体：$($sig.SignerCertificate.Subject)）。"
          } else {
            $lines += "> [!WARNING]"
            $lines += "> 本产物**未做代码签名**，Windows SmartScreen 可能提示「未知发布者」，点「更多信息 → 仍要运行」即可。"
            $lines += "> 请对照 ``SHA256SUMS.txt`` 校验完整性。签名进度见 docs/release.md。"
          }
          $lines += ""
          $lines += "## 数据与隐私"
          $lines += ""
          $lines += "- 数据只写在本机 ``%APPDATA%\Sisyphus\sisy-store.json``（每日备份保留 10 份），卸载默认保留用户数据"
          $lines += "- 应用**不发起任何网络请求**、无遥测；隐私与安全口径见 SECURITY.md"
          $lines += "- 平台：Windows 10/11 x64；macOS/Linux 暂不支持"
          $lines += ""
          $lines += "## 版本说明"
          $lines += ""
          $lines += "完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)。"
          $lines | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8
          Get-Content RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Sisyphus ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
